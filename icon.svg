<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 底色：产品深色主题的底（#0a0f16 略提亮一档），圆角方形 -->
  <rect width="512" height="512" rx="112" fill="#0E1A28"/>
  <!-- 手机：描边用页面的 ice 色，屏幕用面板色 -->
  <rect x="170" y="96" width="172" height="320" rx="32" fill="#16232F" stroke="#A9C8E8" stroke-width="20"/>
  <!-- 终端提示符：金色箭头 + ice 光标块，只说一件事——在这里能敲指令 -->
  <path d="M208 226 L244 258 L208 290" fill="none" stroke="#C9A55C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="266" width="46" height="26" rx="8" fill="#A9C8E8"/>
